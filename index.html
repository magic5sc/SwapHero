<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111823"><title>SwapHero | 对战测试</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header class="topbar"><div><div class="eyebrow">SWAPHERO <span>·</span> BATTLE LAB</div><h1>换位对决 <small>原型测试</small></h1></div><button id="reset" class="ghost">重新开始</button></header>
<div class="notice">测试版本 · 当前使用无技能占位卡，正式卡牌与完整效果仍在开发</div>
<section class="scoreboard" aria-label="对战状态"><div class="side-score enemy"><span>我方</span><strong id="player-score">0</strong></div><div class="round"><span id="phase">布阵阶段</span><div class="round-caption" id="ap">调整你的队伍</div></div><div class="side-score player"><span>对手</span><strong id="enemy-score">0</strong></div></section>
<section class="enemy-reserve"><div class="section-head"><div><div class="eyebrow">ENEMY RESERVE</div><h2>对手后备区</h2></div><span id="enemy-count" class="pill"></span></div><div id="enemy-bench" class="bench"></div></section><section class="battle"><div class="section-head"><div><div class="eyebrow">THE ARENA</div><h2>战场 <small>上方对手 · 下方我方</small></h2></div><span class="legend"><i></i> 对手 <i></i> 我方</span></div><div id="lanes" class="lanes"></div></section>
<section class="reserve"><div class="section-head"><div><div class="eyebrow">YOUR RESERVE</div><h2>我的替补 <small>拖拽或点击卡牌换位</small></h2></div><span class="pill" id="reserve-count"></span></div><div id="player-bench" class="bench"></div></section>

<section class="actionbar"><div class="guidance"><div class="guide-label">操作指引</div><p id="hint" aria-live="polite"></p><p id="feedback" role="status"></p></div><div class="buttons"><button id="cancel" class="ghost" hidden>取消选择</button><button id="start" class="primary">完成布阵 <span>→</span></button><button id="end" class="primary" hidden>结束回合 <span>→</span></button></div></section>
<details class="history"><summary>战斗记录 <span>展开查看</span></summary><ol id="log"></ol></details><footer>SWAPHERO · 对战原型 <span>5 胜利点获胜</span></footer></main><script type="module" src="src/app.mjs"></script></body></html>
