<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远征配置工坊 · SwapHero</title>
<style>*{box-sizing:border-box}body{margin:auto;max-width:1250px;background:#f6f1e5;color:#183d37;font:15px/1.5 system-ui;padding:24px}header,section,nav{margin-bottom:16px}h1{margin:2px 0}button,input,select{font:inherit;padding:7px;border:1px solid #a5aca0;border-radius:5px;background:white}button{cursor:pointer}button[aria-pressed=true],.primary{background:#23584c;color:white}button:disabled{opacity:.5}nav,.actions{display:flex;gap:6px;flex-wrap:wrap}.layout{display:grid;grid-template-columns:minmax(180px,27%) 1fr;gap:16px}.panel{padding:16px;background:#fffdf6;border:1px solid #d4c8aa;border-radius:9px}#rows{width:100%;min-height:220px}.fields,.formation{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.formation{background:#e1e9dc;padding:12px;margin:10px 0}label{display:grid;gap:3px}input,select{width:100%}#status{min-height:24px;color:#783b13;white-space:pre-wrap}small{color:#576a60}@media(max-width:700px){body{padding:12px}.layout{grid-template-columns:1fr}#rows{min-height:70px;height:85px}.fields{grid-template-columns:1fr 1fr}}</style>
<header><small>SWAPHERO / 开发工具</small><h1>远征配置工坊</h1><a href="editor.html">卡牌编辑器</a> · <a href="config/SwapHero.xlsx" download>下载当前版本 Excel</a><p>载入工作簿，选择记录编辑。导出的 Excel 是本次修改的交付文件。</p></header>
<div class="actions"><button id="import">导入 Excel</button><input type="file" id="file" accept=".xlsx" hidden><button id="validate">校验五表</button><button class="primary" id="export">导出更新后的 Excel</button></div><p id="status" role="status"></p><nav id="tabs"></nav>
<div class="layout"><section class="panel"><select id="rows" size="12" aria-label="记录"></select><div class="actions"><button id="add">新增</button><button id="copy">复制</button><button id="remove">删除</button></div></section><section class="panel"><h2 id="title"></h2><p id="help"></p><div id="form"></div></section></div>
<script src="vendor/xlsx/xlsx.min.js"></script><script type="module" src="src/config-editor.mjs"></script></html>
