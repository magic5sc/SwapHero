<html lang="zh-CN"><head><script>location.replace("pixelfx-vertical.html?effect=spear");</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwapHero · 螺旋光矛 · 光子爆炸</title><link rel="stylesheet" href="pixelfx-preview.css"><link rel="stylesheet" href="pixelfx-vertical.css"></head>

<header><div><span class="eyebrow">SWAPHERO / MOTION LAB</span><h1>螺旋光矛 · 光子爆炸</h1><p>双螺旋光矛向上发射，在命中位置绽放光子爆炸。</p></div><a href="tests.html">← 返回测试台</a><a href="pixelfx-preview.html">横向原版 ↗</a></header>
<div class="layout"><section class="preview" aria-label="表演舞台"><div class="stage-head"><div><span class="eyebrow">正在预览</span><h2 id="effect-title">螺旋光矛 · 光子爆炸</h2></div><span id="phase" role="status">正在载入…</span></div>
