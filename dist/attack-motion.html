<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SwapHero · 普攻位移对比</title><link rel="stylesheet" href="attack-motion.css"></head><body><main>
<header><div><span class="eyebrow">SWAPHERO / ATTACK MOTION LAB</span><h1>这一次，谁打谁？</h1><p>同一场景、同一节奏，只比较攻击位移。默认先看最远对角。</p></div><a href="tests.html">返回测试台 ↗</a></header>
<section class="controls" aria-label="预览设置"><div class="choice"><span>表现方式</span><div id="modes"><button data-mode="short" aria-pressed="true">A · 角色短突进</button><button data-mode="card" aria-pressed="false">B · 整卡冲撞</button></div></div><div class="choice"><label for="route">攻击目标</label><select id="route"><option value="straight">对位 · 直线</option><option value="near">相邻 · 斜向</option><option value="far" selected>最远 · 对角</option></select></div><div class="choice"><label for="actor">出演角色</label><select id="actor"><option value="temple_swordsman">教会剑士</option><option value="temple_knight">教会骑士</option></select></div></section>
<section class="stage-wrap"><div class="stage-top"><strong id="mode-title">A · 角色短突进</strong><span id="phase" role="status">加载角色…</span></div><div id="board" aria-label="独立十二格战斗预览"><div class="row rear" id="enemy-rear"></div><div class="row front" id="enemy-front"></div><div class="battle-line"><span>对手</span><span>我方</span></div><div class="row front" id="player-front"></div><div class="row rear" id="player-rear"></div><svg id="route-line" aria-hidden="true"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#ffe3a0" stroke-width="2"/></marker></defs><path id="line" marker-end="url(#arrow)"/></svg><canvas id="attack-slash" aria-hidden="true" hidden></canvas><div id="impact" aria-hidden="true">✦</div><div id="damage" aria-hidden="true">−4</div></div><div id="caption">我方左侧 → 对手右侧</div></section>
<section class="transport"><button id="play" class="primary" disabled>重播</button><button id="pause" disabled>暂停</button><button id="sequence" disabled>连续看三种目标</button><label>速度 <select id="speed"><option value="0.5">½ 倍</option><option value="1" selected>正常</option></select></label><label><input id="guide" type="checkbox" checked>目标辅助线</label><label><input id="show-fx" type="checkbox" checked>A · 剑刃斩击</label></section><label class="timeline-label" for="timeline">逐帧查看 <output id="time">0.00 s</output></label><input id="timeline" type="range" min="0" max="1.2" step="0.001" value="0" disabled><p id="description">A：角色短突进；PixelFX 剑刃斩击在目标身上按攻击方向旋转，角色自身不旋转。</p><p id="error" role="alert" hidden></p><footer>独立动作试演 · 固定演示伤害 4 · 不读取或写入远征、教学或编辑器存档。目标手动指定用于比较方向，不代表正式选敌规则。<a href="index.html">返回游戏</a></footer>
</main><script type="module" src="src/attack-motion.mjs"></script></body></html>
