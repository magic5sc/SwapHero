<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>粒子特效 · SwapHero</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#e8eddf;color:#23454b;font:16px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{margin:5px 0;font-size:28px}small{color:#647c75}a{color:#256c7d}section{display:grid;grid-template-columns:1fr 260px;gap:24px;margin-top:24px}.stage{min-height:430px;display:grid;place-items:center;position:relative;border:3px solid #47666a;background:linear-gradient(#18344766,#18344766),url('assets/sky-islands/sky-arena.png') center/cover;box-shadow:0 8px 0 #cbd4c4}.stage.dark{background:#20333c}.stage.light{background:#e7e5d5}canvas{width:min(100%,512px);aspect-ratio:1;image-rendering:pixelated;max-height:512px;object-fit:contain}aside{padding:20px;background:#f9f7eb;border:1px solid #bccab6}label{display:block;margin:12px 0}input[type=range],select,button{width:100%}button,select{padding:10px;border:1px solid #597571;border-radius:4px;background:#fffbee;color:#23454b;font:inherit}button{cursor:pointer;background:#ecb35e;font-weight:700;margin:8px 0}button.secondary{background:#e0e8d9}output{float:right;font-variant-numeric:tabular-nums}.note{font-size:14px;color:#536c64}.status{min-height:24px}input[type=checkbox]{accent-color:#426b6c}@media(max-width:700px){main{padding:16px}section{grid-template-columns:1fr}.stage{min-height:300px}header{display:block}}
</style><main><header><div><small>SWAPHERO / 特效预览 01</small><h1 id="title">刀光命中</h1></div><a href="editor.html">返回卡牌编辑器 →</a></header><section><div class="stage" id="stage"><canvas id="fx" width="128" height="128" aria-label="刀光命中粒子效果"></canvas></div><aside><label>特效<select id="preset"><option value="slash">刀光命中</option><option value="fireball">小火球命中爆炸</option></select></label><strong id="subtitle">直线斩切 · 像素碎光</strong><label>刀光角度 <output id="angleValue">-45°</output><input id="angle" type="range" min="-90" max="90" value="-45"></label><label>火星 / 碎光数量 <output id="countValue">14</output><input id="count" type="range" min="0" max="40" value="14"></label><label>播放速度<select id="speed"><option value="1">正常 · 420ms</option><option value=".5">半速观察</option><option value=".25">四分之一速度</option></select></label><label>主体颜色 <input type="color" id="color" value="#fff2ab"></label><label>预览背景<select id="bg"><option value="">战斗场景</option><option value="dark">深色</option><option value="light">浅色</option></select></label><button id="play">播放命中</button><button id="pause" class="secondary">暂停 / 继续</button><label><input type="checkbox" id="loop" checked> 循环预览</label><label>逐帧查看 <output id="timeValue">0ms</output><input id="time" type="range" min="0" max="420" value="0"></label><button id="copy" class="secondary">复制资产配置</button><div id="status" class="status note" aria-live="polite"></div></aside></section><p class="note">128 × 128 逻辑画布 · 刀光与小火球命中 / 独立运动粒子。拖动时间条可检查单帧；当前调整仅用于预览，复制配置后可粘贴到编辑器的美术资产库。</p></main><script type="module">
import{createSlash,drawSlash,SLASH_DEFAULTS}from './src/particle-fx.mjs';
import{createFireball,drawFireball,FIREBALL_DEFAULTS}from './src/fireball-fx.mjs';
const $=id=>document.getElementById(id),ctx=$('fx').getContext('2d');
let sim,time=0,last=null,paused=false;
const isFire=()=>$('preset').value==='fireball';
const config=()=>({...isFire()?FIREBALL_DEFAULTS:SLASH_DEFAULTS,asset_id:isFire()?'pixel_fireball_hit':'pixel_slash',name:isFire()?'小火球命中·粒子':'刀光命中·粒子',type:'effect',...isFire()?{}:{angle_deg:Number($('angle').value)},particle_count:Number($('count').value),color:$('color').value});
function draw(){const ms=Math.min(time,sim.options.duration_ms);(isFire()?drawFireball:drawSlash)(ctx,sim,ms);$('time').value=ms;$('timeValue').value=Math.round(ms)+'ms';}
function rebuild(){sim=(isFire()?createFireball:createSlash)(config());$('angleValue').value=$('angle').value+'°';$('countValue').value=$('count').value;$('time').max=sim.options.duration_ms;draw();}
function select(){const d=isFire()?FIREBALL_DEFAULTS:SLASH_DEFAULTS;$('color').value=d.color;$('count').value=d.particle_count;$('angle').closest('label').hidden=isFire();$('title').textContent=isFire()?'小火球命中爆炸':'刀光命中';$('subtitle').textContent=isFire()?'火焰膨胀 · 火星飞散 · 烟粒消散':'直线斩切 · 像素碎光';$('fx').setAttribute('aria-label',$('title').textContent);$('speed').options[0].textContent='正常 · '+d.duration_ms+'ms';time=0;last=null;rebuild();}
$('preset').onchange=select;
$('play').onclick=()=>{time=0;paused=false;last=null;};
$('pause').onclick=()=>{paused=!paused;last=null;};
$('time').oninput=()=>{paused=true;time=Number($('time').value);draw();};
for(const id of ['angle','count','color'])$(id).oninput=()=>{if(!paused){time=0;last=null;}rebuild();};
$('bg').onchange=()=>{$('stage').className='stage '+$('bg').value;};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(config(),null,2));$('status').textContent='已复制 '+config().asset_id+' 资产定义';}catch{$('status').textContent='浏览器未允许复制';}};
$('preset').value=new URLSearchParams(location.search).get('preset')==='fireball'?'fireball':'slash';select();
if(matchMedia('(prefers-reduced-motion: reduce)').matches){$('loop').checked=false;paused=true;time=80;draw();}
function tick(now){if(!document.hidden&&!paused){if(last!==null)time+=(now-last)*Number($('speed').value);if(time>sim.options.duration_ms+600&&$('loop').checked)time=0;draw();}last=now;requestAnimationFrame(tick);}document.addEventListener('visibilitychange',()=>{last=null;});requestAnimationFrame(tick);
</script></html>
